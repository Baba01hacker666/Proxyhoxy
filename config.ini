# Proxyhoxy-main/config.ini
[settings]
# Port for the proxy server to listen on
proxy_port = 8080

# Port for the web admin panel
admin_port = 5000
admin_user = admin
admin_password = changeme
# Log file paths
log_file = datapassed.txt
ext_log_file = extinon.txt
download_folder = downloads

# List of file extensions to automatically download
# Comma-separated list
download_extensions = .apk,.zip,.iso,.rar,.tar,.7z,.exe,.bin,.msi,.dmg

[mitm]
# Enable Man-in-the-Middle for HTTPS traffic (true/false)
# REQUIRES a generated CA certificate to be trusted by the client.
# Run generate_ca.py first.
enable_https_mitm = true

[content_modification]
# Enable content replacement (true/false)
# This will replace keywords in text-based web content (HTML, JS, CSS, etc.)
enable_replacement = false

# Add keywords and their replacements below
# format: keyword = replacement_text
# Example: "Proxy" will be replaced with "Hacked"
